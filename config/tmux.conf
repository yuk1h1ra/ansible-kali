# ===== 基本動作 =====
set -g mouse on                      # マウスでペイン選択/リサイズ/スクロール可能に
set -g history-limit 10000
set -sg escape-time 0                # vimでのESC遅延対策
set -g base-index 1                  # ウィンドウ番号を1始まりに
setw -g pane-base-index 1
setw -g mode-keys vi                 # コピーモードをvi風に
set -g default-terminal "screen-256color"

# ===== キーバインド（prefixはデフォルトのC-bのまま） =====
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# 直感的な分割キー（|で縦分割、-で横分割）、カレントパス継承
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# prefix+矢印でペインリサイズ（連打可能）
bind -r Left  resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Down  resize-pane -D 5
bind -r Up    resize-pane -U 5

# ===== ステータスバー =====
set -g status-style bg=black,fg=white
set -g status-left "#[fg=green]#S "
set -g status-right "#[fg=yellow]%Y-%m-%d %H:%M"
set -g status-interval 5
