# dotfiles (tmux/.tmux.conf) の設定を、プラグイン(TPM)無しで可能な限り再現したもの。
# 各プラグインが行っている設定を素の tmux コマンドで書き下している。

##############################
#       Basic Settings       #
##############################

# 設定ファイルをリロードする
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# tmuxのprefixキーバインドをCtrl-tに変更
set-option -g prefix C-t

# Ctrl-bのキーバインドを解除する
unbind C-b

# Ctrl-t*2でtmux内のプログラムにCtrl-tを送る
bind C-t send-prefix

# キーストロークのディレイを減らす
set -sg escape-time 1

# ウィンドウのインデックスを1から始める
set -g base-index 1

# ペインのインデックスを1から始める
setw -g pane-base-index 1

# マウス操作を有効にする
setw -g mouse on

##############################
#   tmux-sensible 相当       #
##############################

set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5
set -g default-terminal "screen-256color"
set -g status-keys emacs
set -g focus-events on
setw -g aggressive-resize on

bind C-p previous-window
bind C-n next-window
bind R source-file ~/.tmux.conf \; display "Sourced ~/.tmux.conf!"

##############################
#  tmux-pain-control 相当    #
##############################

# Vimのキーバインドでペインを移動する
bind h   select-pane -L
bind C-h select-pane -L
bind j   select-pane -D
bind C-j select-pane -D
bind k   select-pane -U
bind C-k select-pane -U
bind l   select-pane -R
bind C-l select-pane -R

# ウィンドウの並べ替え
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

# ペインのリサイズ
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ペイン分割（カレントパスを引き継ぐ）
bind "|"  split-window -h  -c "#{pane_current_path}"
bind "\\" split-window -fh -c "#{pane_current_path}"
bind "-"  split-window -v  -c "#{pane_current_path}"
bind "_"  split-window -fv -c "#{pane_current_path}"
bind "%"  split-window -h  -c "#{pane_current_path}"
bind '"'  split-window -v  -c "#{pane_current_path}"
bind c    new-window -c "#{pane_current_path}"

##############################
# split-window-cross 相当    #
##############################

# prefix + で4分割（十字）
bind + split-window -h \; split-window -v \; select-pane -L \; split-window -v \; select-pane -U

##############################
#     tmux-yank 相当         #
##############################

# コピーモードの y でクリップボードへ、Y で貼り付け、マウス選択は PRIMARY へ（xclip 必須）
bind -T copy-mode    y   send -X copy-pipe-and-cancel "xclip -selection clipboard -i"
bind -T copy-mode-vi y   send -X copy-pipe-and-cancel "xclip -selection clipboard -i"
bind -T copy-mode    Y   send -X copy-pipe-and-cancel "tmux paste-buffer -p"
bind -T copy-mode-vi Y   send -X copy-pipe-and-cancel "tmux paste-buffer -p"
bind -T copy-mode    M-y send -X copy-pipe-and-cancel "xclip -selection clipboard -i; tmux paste-buffer -p"
bind -T copy-mode-vi M-y send -X copy-pipe-and-cancel "xclip -selection clipboard -i; tmux paste-buffer -p"
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -selection primary -i"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -selection primary -i"

##############################
#    tmux-logging 相当       #
##############################

# prefix P: ペインのロギング開始/停止（~/tmux-<session>-<window>-<pane>-<日時>.log、ANSIエスケープ除去）
bind P if -F "#{pane_pipe}" {
  pipe-pane
  display "Ended logging"
} {
  pipe-pane 'exec cat - | sed -r "s/(\x1B\[([0-9]{1,2}(;[0-9]{1,2})?)?[m|K]|\r)//g" >> ~/tmux-#{session_name}-#{window_index}-#{pane_index}-%Y%m%dT%H%M%S.log'
  display "Started logging to ~/tmux-#{session_name}-#{window_index}-#{pane_index}-%Y%m%dT%H%M%S.log"
}

# prefix M-p: 画面に見えている範囲をファイルに保存
bind M-p run-shell 'f=~/tmux-screen-capture-#{session_name}-#{window_index}-#{pane_index}-$(date +%Y%m%dT%H%M%S).log; tmux capture-pane -J -p -t "#{pane_id}" > "$f" && tmux display "Screen capture saved to $f"'

# prefix M-P: スクロールバックを含む全履歴をファイルに保存
bind M-P run-shell 'f=~/tmux-history-#{session_name}-#{window_index}-#{pane_index}-$(date +%Y%m%dT%H%M%S).log; tmux capture-pane -J -p -S - -t "#{pane_id}" > "$f" && tmux display "History saved to $f"'

# 新しいペイン/ウィンドウは script 経由でシェルを起動し、~/tmux-logs に常時自動記録する
# （ファイル名: <日時>-pane<ペインID>.log / .timing。`scriptreplay -t X.timing X.log` で再生可能）
set -g default-command 'mkdir -p ~/tmux-logs && f=~/tmux-logs/$(date +%Y%m%dT%H%M%S)-pane${TMUX_PANE#%} && exec script -q -f --log-timing "$f.timing" "$f.log"'

# prefix M-c: ペインの履歴を消去
bind M-c clear-history \; display "Pane history cleared"

##############################
#      Display Settings      #
##############################

# ステータスバーを上部に表示する
set -g status-position top

##############################
#  tmux-powerline 相当       #
#  (theme: simple)           #
##############################

# Powerline 用パッチフォントが無くても崩れない記号を使う
set -g status-style "fg=colour255,bg=colour235"
set -g status-justify left
set -g status-left-length 120
set -g status-right-length 90
set -g status-interval 1

# 左: セッション情報 / LAN IP / VPN(tun*) IP
set -g status-left '#[fg=colour234,bg=colour148] #S:#I.#P #[fg=colour148,bg=colour24]▶#[fg=colour255,bg=colour24] ⓛ #(ip -4 -o route get 1.1.1.1 2>/dev/null | sed -n "s/.* src \([0-9.]*\).*/\1/p")#(ip -4 -o addr show 2>/dev/null | sed -nE "s/^[0-9]+: +(u?tun[0-9]+) +inet ([0-9.]+).*/ ❯ \1 \2/p" | head -n 1) #[fg=colour24,bg=colour235]▶ '

# 右: 曜日 / 日付 / 時刻
set -g status-right '#[fg=colour136,bg=colour235] %a ❮ %F ❮ %H:%M '

# ウィンドウ一覧
setw -g window-status-format " #I#{?window_flags,#F, } ❯ #W "
setw -g window-status-current-format "#[reverse]▶ #I#F ❯ #W #[noreverse]▶"
